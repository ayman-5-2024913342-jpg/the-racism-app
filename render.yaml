# Render Blueprint for THE GREAT APP (optional shortcut; the manual dashboard steps work too).
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: great-app-db
    plan: free
    region: singapore
    databaseName: great_app
    user: great_app

services:
  - type: web
    name: the-great-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # keep the same region as the database
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true    # Render generates a strong random value (32+ chars)
      - key: DATABASE_URL
        fromDatabase:
          name: great-app-db
          property: connectionString
      # Tighten to your exact hostname (e.g. the-great-app.onrender.com) after the first deploy.
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      # Render's proxy sits in front of gunicorn; trust its forwarded headers.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Free instance has 512 MB RAM: run a single worker.
      - key: WEB_CONCURRENCY
        value: "1"
